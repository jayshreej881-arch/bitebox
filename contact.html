<form>

    <br>
    <input type="text" id="fullname" name="fullname">
    <br><br>

    <label for="email">email address</label>

    <br><br>

    <label for="password">Password</label>
<br>
<input type="password" id="password" name="password">
<br><br>
	
<label for="phone">Phone Number</label>
<br>
<input type="tel" id="phone" name="phone">

<h3>Order Information</h3>
<label for="quantity">Quantity</label>
 
<br>
 
<input
type="number"
id="quantity"
name="quantity">
 
<br><br>

<label for="deliveryDate">
 
Preferred Delivery Date
 
</label>
 
<br>
 
<input
type="date"
id="deliveryDate"
name="deliveryDate">
 
<br><br>

<label for="food"> Select Food Item </label>
<br>
<select id="food"
name="food">
 
<option>
 
Veg Pizza
 
</option>
 
<option>
 
Cheese Burger

</option>

<option>

White Sauce Pasta

</option>

<option>

Veg Grilled Sandwich

</option>

<option>

Chocolate Brownie

</option>
</select>

<h3> Payment Method </h3>

<input type="radio"  id="cash" name="payment" >
<label for="cash"> cash </label>
<br>

<input type="radio" name="payment" id="card">
<label for="card"> card </label>
<br>

<input type="radio" name="payment" id="upi">

<input type="checkbox" id="cheese" name="extras">

<br>

<br>
 
<input type="checkbox" id="dessert" name="extras">
<label for="dessert"> Dessert </label>
<br><br>

<label for="address">

  delivery address

<textarea name="address" name="address"rows="5" cols="40">
