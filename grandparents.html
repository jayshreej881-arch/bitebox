<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #grandparent{
        height: 800px;
        width: 800px;
        background-color: red;
        border: 2px solid gray;
    }
    #parent{
        height: 600px;
        width: 600px;
        background-color: yellow;

    }
    #child{
        height: 400px;
        width: 400px;
        background-color: skyblue;
    }
</style>
<body>
    <div id="grandparent">
    <div id="parent">
    <div id="child">
     </div>
     </div>
     </div>

    <script>
        function red(){
            alert("red box is clicked");
        }
        function yellow(){
            alert("yellow box is clicked");
        }
        function skyblue(){
            alert("skyblue box is clicked");
        }
        let grandparent=document.querySelector("#grandparent");
        grandparent.addEventListener("click",red)
        let prantent=document.querySelector("#parent");
        prantent.addEventListener("click",yellow)
        let child=document.querySelector("#child");
        child.addEventListener("click",skyblue)
    </script>
</body>
</html>
